<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 472 450" width="472" height="450" role="img" aria-labelledby="t d">
<title id="t">Mit Dokument: China so treu wie der Rest</title>
<desc id="d">Zusammenfassen: Qwen 9B China 25/30, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha) 26/30; Qwen 35B China 28/30, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha) 27/30. Bewertung im Text wiedergeben: Qwen 9B China 15/30, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha) 17/30; Qwen 35B China 16/30, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha) 19/30</desc>
