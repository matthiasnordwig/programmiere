<text x="253.46666666666667" y="289.5" class="v ink">16/30</text>
<path d="M96 292H271.8666666666667a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H96Z" class="s2"><title>Qwen 35B, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha): 19 von 30</title></path>
<text x="281.8666666666667" y="301.5" class="v ink">19/30</text>
<line x1="96" x2="96" y1="240" y2="308" class="axis" stroke-width="1"/>
<text x="0" y="334" class="lb ink">Zahl heraussuchen: 5 von 5, beide Seiten, beide Modelle.</text>
<text x="0" y="354" class="l ink">Verweigerung, Parteifloskel, nachgeschobene Regierungsposition:</text>
<text x="0" y="371" class="l ink">0 in 30 China-Antworten.</text>
<text x="0" y="400" class="f mut">Bei fünf Texten je Seite sind 1 bis 3 Kernaussagen Unterschied Rauschen.</text>
<text x="0" y="415" class="f mut">Die Bewertungsfrage zielt nur auf den Akteur, daher weniger Treffer.</text>
