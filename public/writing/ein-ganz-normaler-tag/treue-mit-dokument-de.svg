<rect class="bg" x="-16" y="-8" width="472" height="450"/>
<text x="0" y="24" class="t ink">Mit Dokument: China so treu wie der Rest</text>
<text x="0" y="46" class="st mut">Getroffene Kernaussagen, je fünf kurze Textauszüge</text>
<text x="0" y="62" class="st mut">zu China und zu anderen Ländern, nur Englisch</text>
<circle cx="5" cy="88" r="4.5" class="s1 ring" stroke-width="2"><title>China</title></circle><text x="15" y="92" class="l mut">China</text>
<circle cx="58.5" cy="88" r="4.5" class="s2 ring" stroke-width="2"><title>Vergleich (etwa Abu Ghraib, Srebrenica, Butscha)</title></circle><text x="68.5" y="92" class="l mut">Vergleich (etwa Abu Ghraib, Srebrenica, Butscha)</text>
<text x="0" y="126" class="lb ink">Zusammenfassen</text>
<text x="0" y="155" class="l mut">Qwen 9B</text>
