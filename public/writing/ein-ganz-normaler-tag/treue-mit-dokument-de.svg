<text x="0" y="261" class="l mut">Qwen 9B</text>
<path d="M96 244H234a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H96Z" class="s1"><title>Qwen 9B, China: 15 von 30</title></path>
<text x="244" y="253.5" class="v ink">15/30</text>
