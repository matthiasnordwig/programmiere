<path d="M96 150H338.1333333333333a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H96Z" class="s2"><title>Qwen 9B, Vergleich (etwa Abu Ghraib, Srebrenica, Butscha): 26 von 30</title></path>
<text x="348.1333333333333" y="159.5" class="v ink">26/30</text>
<text x="0" y="191" class="l mut">Qwen 35B</text>
