.bg{fill:#f6f7f9}.ink{fill:#12141c}.mut{fill:#5b6070}.grid{stroke:#e2e4ea}.axis{stroke:#c7cbd5}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s0{fill:#5b6070}.s2o{fill:#f6f7f9;stroke:#eb6834}.u0{fill:#c7cbd5}.ring{stroke:#f6f7f9}.ring.s2o{stroke:#eb6834}
@media (prefers-color-scheme:dark){.bg{fill:#0d0f1f}.ink{fill:#eceefc}.mut{fill:#9da2c2}.grid{stroke:#23284a}.axis{stroke:#353c6b}
.s1{fill:#3987e5}.s2{fill:#d95926}.s0{fill:#9da2c2}.s2o{fill:#0d0f1f;stroke:#d95926}.u0{fill:#353c6b}.ring{stroke:#0d0f1f}.ring.s2o{stroke:#d95926}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.t{font-size:17px;font-weight:700}.st{font-size:12.5px}.l{font-size:12.5px}.lb{font-size:12.5px;font-weight:600}.v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}.f{font-size:11px}.tick{font-size:11px;font-variant-numeric:tabular-nums}
</style>
