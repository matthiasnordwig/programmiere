<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 472 444" width="472" height="444" role="img" aria-labelledby="t d">
<title id="t">Zensur abschalten kostet Fakten</title>
<desc id="d">Faktenfehler in drei Kontrollantworten ohne Zensurthema (Lidice, Ruanda, Sharpeville), von Hand gezählt. Qwen 9B: ohne Eingriff 8, mit Eingriff 14, ≥15, ≥13, ≥12, 15, ≥12, ≥13, 14, 12, ≥9, 9, ≥14, ≥15, 12, 11, herausgerechnet 9; Qwen 35B: ohne Eingriff 3, mit Eingriff 5, 8, nur bei Bedarf 3.</desc>
