# Nur Prüfung, keine Auslieferung: Gehostet wird auf dem eigenen Server
# (docs/decisions/0009-own-server.md, scripts/deploy-own-server.sh vom Mac aus).
name: Build check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/php-index.mjs dist
